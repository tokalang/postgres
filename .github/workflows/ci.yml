name: PostgreSQL package qualification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOKA_VERSION: main

jobs:
  qualify:
    name: Qualify (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
          - name: macos-arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake curl ninja-build lsb-release pkg-config \
            software-properties-common wget
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 pkgconf openssl@3 cmake ninja zstd
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build Toka toolchain from main
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tokalang/toka.git "$RUNNER_TEMP/toka-source"
          cmake -S "$RUNNER_TEMP/toka-source" -B "$RUNNER_TEMP/toka-source/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${LLVM_DIR:+-DLLVM_DIR="$LLVM_DIR"} \
            ${LLD_DIR:+-DLLD_DIR="$LLD_DIR"} \
            ${ZSTD_LIBRARY:+-DZSTD_LIBRARY="$ZSTD_LIBRARY"} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}
          cmake --build "$RUNNER_TEMP/toka-source/build"
          sdk="$RUNNER_TEMP/toka-sdk"
          mkdir -p "$sdk/bin" "$sdk/lib/sys" "$sdk/lib/toolchain"
          cp "$RUNNER_TEMP/toka-source/build/bin/tokac" "$sdk/bin/tokac"
          cp "$RUNNER_TEMP/toka-source/build/bin/toka" "$sdk/bin/toka"
          cp -r "$RUNNER_TEMP/toka-source/lib/"* "$sdk/lib/"
          cp "$RUNNER_TEMP/toka-source/tools/scripts/toka_build.py" "$sdk/lib/toolchain/toka_build.py"
          cp "$RUNNER_TEMP/toka-source/build/lib/sys/toka_rt.o" "$sdk/lib/sys/toka_rt.o"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          "$TOKA" --version
          "$TOKAC" --version
          pkg-config --exists openssl

      - name: Run standalone qualification
        run: python3 tests/qualify_package.py

  real-service:
    name: Real service (PostgreSQL 16/17)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake curl ninja-build lsb-release pkg-config \
            software-properties-common wget
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Build Toka toolchain from main
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tokalang/toka.git "$RUNNER_TEMP/toka-source"
          cmake -S "$RUNNER_TEMP/toka-source" -B "$RUNNER_TEMP/toka-source/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/toka-source/build"
          sdk="$RUNNER_TEMP/toka-sdk"
          mkdir -p "$sdk/bin" "$sdk/lib/sys" "$sdk/lib/toolchain"
          cp "$RUNNER_TEMP/toka-source/build/bin/tokac" "$sdk/bin/tokac"
          cp "$RUNNER_TEMP/toka-source/build/bin/toka" "$sdk/bin/toka"
          cp -r "$RUNNER_TEMP/toka-source/lib/"* "$sdk/lib/"
          cp "$RUNNER_TEMP/toka-source/tools/scripts/toka_build.py" "$sdk/lib/toolchain/toka_build.py"
          cp "$RUNNER_TEMP/toka-source/build/lib/sys/toka_rt.o" "$sdk/lib/sys/toka_rt.o"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Run real-service qualification
        run: python3 tests/qualify_real_service.py --report build/postgres-real-service.json

      - name: Upload fail-closed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-real-service
          path: build/postgres-real-service.json
          if-no-files-found: error
